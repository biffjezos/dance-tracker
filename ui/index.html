<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dance Tracker 5000</title>
        <link rel="stylesheet" href="./vendor/bootstrap/bootstrap-grid.min.css">
        <link rel="stylesheet" href="./vendor/bootstrap/bootstrap-utilities.min.css">
        <link rel="stylesheet" href="./styles/colors.css">
        <link rel="stylesheet" href="./styles/fonts.css">
        <link rel="stylesheet" href="./styles/styles.css">
    </head>
    <body>
        <div id="app">
            <header class="titlebar">
                <div class="title-group">
                    <span class="title-icon">✧</span>
                    <span class="title-text">DANCE TRACKER 5000</span>
                </div>

                <div class="subtitle">
                    REALTIME DEMO SCENE VIDEO SYNTHESIZER
                </div>
            </header>
            <nav class="main-menu">
                <button
                    id="main-menu-toggle"
                    class="menu-toggle-button d-lg-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#main-menu-items"
                    aria-expanded="false"
                    aria-controls="main-menu-items"
                > ☰ MENU </button>

                <div class="main-menu-items collapse d-lg-flex" id="main-menu-items"></div>
            </nav>
            <nav id="sub-menu" class="sub-menu"></nav>

            <main class="workspace">
                <section class="panel camera-panel">
                    <div class="panel-title">
                        <span id="camera-panel-title">PREVIEW: NONE</span>
                        <button class="panel-switch-inline" data-toggle-panel="preview" type="button" title="Switch preview/output">⟷</button>
                        <button class="expand-button" data-panel="preview">⤢</button>
                    </div>
                    <div class="screen">
                        <video id="camera" autoplay muted playsinline style="display:none"></video>
                        <canvas id="camera-preview"></canvas>
                    </div>
                </section>

                <section class="panel output-panel">
                    <div class="panel-title">
                        <span id="live-output-title">LIVE: NONE</span>
                        <button class="panel-switch-inline" data-toggle-panel="output" type="button" title="Switch preview/output">⟷</button>
                        <button class="expand-button" data-panel="output">⤢</button>
                    </div>
                    <div class="screen output-stack">
                        <canvas id="master-layer"></canvas>
                    </div>
                </section>
            </main>

            <footer class="statusbar">
                <span> STATUS: READY </span>

                <span> FPS: -- </span>

                <span> TYPE: VIDEO </span>

                <span> REC: OFF</span>
                <span id="output-resolution" title="Click to change canvas resolution">  320x240 1.333 </span>
                <span id="gamut-warning" class="gamut-warning" hidden> NODE OUT OF GAMUT. CLAMP BEFORE RGB RENDER OUT. </span>
            </footer>
        </div>
        <script src="./vendor/bootstrap/bootstrap.bundle.min.js"></script>
        <script type="module" src="./scripts/app.js"></script>
    </body>
</html>
