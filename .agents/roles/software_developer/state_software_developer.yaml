current_task:
  name: SPEC-webgpu-operations Phase 1.2 (procedural ops) - implemented, awaiting review
  description: >
    Implemented SPECwebgpuoperations.md's Phase 1.2 (CHECKERBOARD, RING
    GPU dispatch) on branch claude/agent-setup-prep-oyj2ri, following
    the pattern from Phases 0/1.1. Both operations have no wired inputs
    at all, so their fingerprints are keyed on ctx.meta.width/height
    plus their own parameters (no value_ptr_eq, nothing to compare by
    pointer identity). RING needed a runtime-sized storage buffer for
    its unbounded per-ring colors list, using the same arrayLength()
    mechanism gpu/mod.rs's own test already demonstrates. Both output
    U8Image via Color::to_rgba_u8's truncating cast, not
    to_image_clamped's rounding one - a new quantization-rule
    distinction flagged for reviewer attention. Could not run cargo
    build/cargo test in this sandbox (same restriction as every prior
    phase). Filed one RFI covering both operations.
