# .agents/docs/state_definitions/state_definition_code_reviewer.yaml

state_definition:
  name: state_definition_code_reviewer
  version: 1
  owner_role: management

description:
  purpose: >
    Defines the operational state model for the Code Reviewer role.
    The state records implementation evaluation against approved
    specifications, review findings, feedback communication, and
    completion of review responsibilities.

fields:

  active_review:
    required: true
    type: object
    properties:

      specification_id:
        type: string
        required: true
        description: >
          Identifier of the specification associated with the implementation
          being reviewed.

      implementation_reference:
        type: string
        required: true
        description: >
          Reference to the implementation change being evaluated.

  status:
    required: true
    type: enum
    values:

      idle:
        meaning: >
          No implementation review is currently assigned.

      assigned:
        meaning: >
          A completed implementation has been assigned for review.

      analyzing:
        meaning: >
          The implementation, specification, review history, and any newly
          received technical information are being analyzed before review continues.

      reviewing:
        meaning: >
          Implementation is being evaluated against the specification,
          architecture constraints, and quality requirements.

      requesting_developer_changes:
        meaning: >
          Review findings have been identified and sent to the Software
          Developer for correction.

      waiting_for_developer_changes:
        meaning: >
          The reviewer is waiting for the Software Developer to address
          requested changes.

      approved:
        meaning: >
          The implementation satisfies the specification and review
          requirements.

      blocked:
        meaning: >
          Review cannot continue because required information, access,
          or decisions are unavailable.

  review_scope:
    required: true
    type: object
    properties:

      specification:
        type: string
        required: true
        description: >
          Specification used as the source of truth for evaluation.

      criteria:
        type: array
        required: true
        description: >
          Review criteria applied during evaluation.
        item_type:
          type: string

  findings:
    required: true
    type: array
    description: >
      Issues, deviations, or improvement requests discovered during review.
    item_type:
      type: string

  validation:
    required: true
    type: object
    properties:

      checks_performed:
        type: array
        required: true
        description: >
          Review checks and validation activities performed.
        item_type:
          type: string

      results:
        type: array
        required: true
        description: >
          Results of performed review checks.
        item_type:
          type: string

  rfis:
    required: true
    type: array
    description: >
      Requests For Information created when clarification is required from
      the Software Developer, Software Architect, or Management.
    item_type:
      type: string

  handoff:
    required: true
    type: object
    properties:

      target_role:
        required: true
        type: enum
        values:
          "null":
            meaning: >
              No handoff is currently planned.

          software_developer:
            meaning: >
              Review findings are being returned to the Software Developer.

          software_architect:
            meaning: >
              Architectural clarification is required.

          management:
            meaning: >
              Management decision is required.

      status:
        required: true
        type: enum
        values:
          "null":
            meaning: >
              No handoff exists.

          pending:
            meaning: >
              Handoff preparation has started.

          sent:
            meaning: >
              Handoff has been submitted.

          accepted:
            meaning: >
              Receiving role has accepted the handoff.

state_transitions:

  idle:
    allowed:
      - assigned

  analyzing:
    allowed:
      - reviewing
      - blocked
  assigned:
    allowed:
      - analyzing
      - blocked

  reviewing:
    allowed:
      - requesting_developer_changes
      - approved
      - blocked
  
  requesting_developer_changes:
    allowed:
      - waiting_for_developer_changes
      - blocked

  waiting_for_developer_changes:
    allowed:
      - analyzing
      - blocked

  approved:
    allowed:
      - idle

  blocked:
    allowed:
      - assigned
      - analyzing