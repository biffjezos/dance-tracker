# .agents/docs/state_definitions/state_definition_technical_advisor.yaml
state_definition:
  name: state_definition_technical_advisor
  version: 1
  owner_role: management

description:
  purpose: >
    Defines the operational state model for the Technical Advisor role.
    The Technical Advisor is outside the implementation workflow - this
    state exists to log consultations (per governance_and_organization.md:
    "All consultations logged in working state") and track RFIs raised
    against the Software Architect and/or Software Developer, not to
    track implementation progress.

fields:

  status:
    required: true
    type: enum
    values:

      idle:
        meaning: >
          No active consultation with the human decision-maker.

      consulting:
        meaning: >
          Actively analyzing a question, document, or codebase area on
          the human's behalf.

      awaiting_rfi_response:
        meaning: >
          An RFI has been sent to the Software Architect and/or Software
          Developer and a response is pending.

      blocked:
        meaning: >
          Advice cannot be finalized because required information is
          unavailable and no RFI is outstanding to obtain it yet.

  current_topic:
    required: false
    type: object
    properties:

      subject:
        type: string
        required: true

      related_specification:
        type: string
        required: false

  rfis_sent:
    required: true
    type: array
    item_type:
      type: object
      properties:
        id:
          type: string
          required: true
        target_role:
          type: enum
          values:
            software_architect:
              meaning: >
                RFI addressed to the Software Architect.
            software_developer:
              meaning: >
                RFI addressed to the Software Developer.
        subject:
          type: string
          required: true
        status:
          type: enum
          values:
            sent:
              meaning: >
                RFI filed, no response yet.
            answered:
              meaning: >
                Target role has responded; response reviewed.

  advice_given:
    required: false
    type: array
    item_type:
      type: string
    # Free-text log of ADVICE-ID / subject entries, for traceability of
    # recommendations made to the human decision-maker - the Technical
    # Advice artifact itself (per communication_protocol.md) is the
    # record; this is just an index of what's been produced this session.

  blockers:
    required: true
    type: array
    item_type:
      type: string

  handoff:
    required: true
    type: object
    properties:

      target_role:
        required: true
        type: enum
        values:
          "null":
            meaning: >
              No RFI currently outstanding.

          software_architect:
            meaning: >
              Waiting on an architectural clarification.

          software_developer:
            meaning: >
              Waiting on an implementation-facing clarification.

      status:
        required: true
        type: enum
        values:
          "null":
            meaning: >
              No handoff exists.

          pending:
            meaning: >
              RFI drafted, not yet sent.

          sent:
            meaning: >
              RFI has been filed.

          answered:
            meaning: >
              Target role has responded.

state_transitions:

  idle:
    allowed:
      - consulting

  consulting:
    allowed:
      - awaiting_rfi_response
      - blocked
      - idle

  awaiting_rfi_response:
    allowed:
      - consulting
      - blocked

  blocked:
    allowed:
      - consulting
      - awaiting_rfi_response
      - idle
