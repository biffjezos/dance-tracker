# .agents/docs/state_definitions/state_definition_software_architect
state_definition:
  name: state_definition_software_architect
  version: 1
  owner_role: management

description:
  purpose: >
    Defines the operational state model for the Software Architect role.
    The state records architectural analysis, specification ownership,
    clarification requests, implementation coordination, and implementation
    review activities.

fields:

  active_specification:
    required: false
    type: object
    description: >
      The specification currently owned by the architect.
      This represents the architect's responsibility for this specification
      only. No active specification exists when the architect is idle after
      completing a handoff.
    properties:

      id:
        type: string
        required: true
        description: >
          Identifier of the specification currently owned by the architect.

      version:
        type: integer
        required: true
        description: >
          Version of the active specification.

  interrupted_work:
    required: false
    type: object
    description: >
      Records architectural work interrupted by a higher-priority developer RFI.

    properties:

      previous_state:
        required: true
        type: enum
        values:

          assigned:
            meaning: >
              The architect was assigned work before handling the RFI.

          analyzing:
            meaning: >
              The architect was analyzing before handling the RFI.

          specifying:
            meaning: >
              The architect was creating or updating a specification before
              handling the RFI.

          reviewing_implementation:
            meaning: >
              The architect was reviewing an implementation before handling
              the RFI.

      specification_id:
        required: false
        type: string
        description: >
          Identifier of the specification related to the interrupted work.

  status:
    required: true
    type: enum
    values:

      idle:
        meaning: >
          No active architectural work is assigned.

      assigned:
        meaning: >
          A work request has been assigned and requires architectural analysis.

      analyzing:
        meaning: >
          Requirements, existing implementation, architecture, and constraints
          are being analyzed.

      waiting_for_management_clarification:
        meaning: >
          Architectural work cannot continue because Management clarification
          or a product decision is required.

      specifying:
        meaning: >
          The architect is creating or updating the technical specification.

      responding_to_developer_rfi:
        meaning: >
          A downstream implementation process has raised an RFI.
          The architect is resolving the architectural question,
          providing clarification, or updating specifications when required.

      reviewing_implementation:
        meaning: >
          An optional Management-assigned architectural review of an
          implementation that has already been approved by the Code Reviewer.
          This review is advisory and may result in recommendations or
          follow-up specifications.

      blocked:
        meaning: >
          Architectural work cannot continue because required information,
          decisions, or dependencies are unavailable.

  waiting_for:
    required: false
    type: object
    description: >
      Records the external event preventing progress.

    properties:

      event:
        required: true
        type: enum
        values:

          management_clarification:
            meaning: >
              Waiting for Management to provide requirements, priorities,
              or product decisions.

  plans:
    required: true
    type: array
    description: >
      Implementation plans associated with the active specification.
    item_type:
      type: string

  conventions:
    required: true
    type: array
    description: >
      Conventions governing architectural and implementation decisions.
    item_type:
      type: string

  parked_work:
    required: true
    type: array
    description: >
      Deferred architectural work.
    item_type:
      type: string

  adrs:
    required: true
    type: array
    description: >
      Architecture Decision Records created during architectural work.
    item_type:
      type: string

  rfis:
    required: true
    type: array
    description: >
      Requests For Information raised by or received by the architect.
    item_type:
      type: string

  notifications:
    required: true
    type: array
    description: >
      Notifications received or generated by the architect.
    item_type:
      type: string

  handoff:
    required: true
    type: object
    description: >
      Records the transfer of completed architectural work to another role.

    properties:

      target_role:
        required: true
        type: enum
        values:

          "null":
            meaning: >
              No handoff is currently planned.

          software_developer:
            meaning: >
              Specification is handed to the Software Developer.

          management:
            meaning: >
              Decision or approval is handed to Management.

      specification_id:
        required: true
        type: string
        description: >
          Identifier of the specification being handed over.

      version:
        required: true
        type: integer
        description: >
          Version of the specification being handed over.

      status:
        required: true
        type: enum
        values:

          "null":
            meaning: >
              No handoff exists.

          pending:
            meaning: >
              Handoff preparation has started.

          sent:
            meaning: >
              Handoff has been submitted.

          accepted:
            meaning: >
              Receiving role has accepted the handoff.

state_transitions:

  idle:
    allowed:
      - assigned
      - reviewing_implementation
      - responding_to_developer_rfi

  assigned:
    allowed:
      - analyzing
      - blocked
      - responding_to_developer_rfi

  analyzing:
    allowed:
      - waiting_for_management_clarification
      - specifying
      - blocked
      - responding_to_developer_rfi

  waiting_for_management_clarification:
    allowed:
      - analyzing
      - blocked

  specifying:
    allowed:
      - responding_to_developer_rfi
      - idle
      - blocked

  responding_to_developer_rfi:
    allowed:
      - assigned
      - analyzing
      - specifying
      - reviewing_implementation
      - idle
      - blocked

  reviewing_implementation:
    allowed:
      - responding_to_developer_rfi
      - idle
      - blocked

  blocked:
    allowed:
      - assigned
      - analyzing
      - specifying
      - waiting_for_management_clarification
      - reviewing_implementation