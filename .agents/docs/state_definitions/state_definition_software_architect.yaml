---
state_definition:
  name: state_definition_software_architect
  version: 1
  owner_role: management

description:
  purpose: >
    Defines the operational state model for the Software Architect role.
    The state records architectural ownership, active specifications,
    implementation coordination, design decisions, and handoff information.

fields:

  active_specification:
    required: true
    type: object
    properties:
      id:
        type: string
        required: true
        description: >
          Identifier of the specification currently owned by the architect.

      version:
        type: integer
        required: true
        description: >
          Version of the active specification.

  status:
    required: true
    type: enum
    values:

      idle:
        meaning: >
          No active architectural work is assigned.

      assigned:
        meaning: >
          A new feature or change request has been assigned for analysis.

      analyzing:
        meaning: >
          Requirements, existing architecture, and implementation impact
          are being analyzed.

      specifying:
        meaning: >
          Specification and implementation plan are being written.

      waiting_for_implementation:
        meaning: >
          Specification has been approved and implementation has been
          delegated to the Software Developer.

      reviewing_implementation:
        meaning: >
          Implementation feedback is being reviewed against the specification.

      blocked:
        meaning: >
          Architectural work cannot continue because information,
          decisions, or dependencies are missing.

      completed:
        meaning: >
          Architectural work for the current specification has completed.

  plans:
    required: true
    type: list
    description: >
      Implementation plans associated with the active specification.
    item_type:
      type: string

  conventions:
    required: true
    type: list
    description: >
      Conventions governing the implementation.
    item_type:
      type: string

  parked_work:
    required: true
    type: list
    description: >
      Deferred architectural work.
    item_type:
      type: string

  adrs:
    required: true
    type: list
    description: >
      Architecture Decision Records created during the specification.
    item_type:
      type: string

  rfis:
    required: true
    type: list
    description: >
      Requests For Information raised during architectural work.
    item_type:
      type: string

  notifications:
    required: true
    type: list
    description: >
      Notifications received or generated by the architect.
    item_type:
      type: string

  handoff:
    required: true
    type: object
    properties:

      target_role:
        required: true
        type: enum
        values:

          null:
            meaning: >
              No handoff is currently planned.

          software_developer:
            meaning: >
              Specification is being handed to Software Developer.

          management:
            meaning: >
              Management review or approval is required.

      status:
        required: true
        type: enum
        values:

          null:
            meaning: >
              No handoff exists.

          pending:
            meaning: >
              Handoff preparation has started.

          sent:
            meaning: >
              Handoff has been submitted.

          accepted:
            meaning: >
              Receiving role has accepted the handoff.

state_transitions:

  idle:
    allowed:
      - assigned

  assigned:
    allowed:
      - analyzing
      - blocked

  analyzing:
    allowed:
      - specifying
      - blocked

  specifying:
    allowed:
      - waiting_for_implementation
      - analyzing
      - blocked

  waiting_for_implementation:
    allowed:
      - reviewing_implementation
      - blocked

  reviewing_implementation:
    allowed:
      - specifying
      - completed
      - blocked

  blocked:
    allowed:
      - assigned
      - analyzing
      - specifying

  completed:
    allowed:
      - idle
