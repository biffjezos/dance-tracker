# .agents/docs/state_definitions/state_definition_software_architect.yaml

state_definition:
  name: state_definition_software_architect
  version: 1
  owner_role: management

description:
  purpose: >
    Defines the operational state model for the Software Architect role.
    The state records architectural analysis, specification ownership,
    clarification requests, implementation coordination, and implementation
    review activities.

fields:

  active_specification:
  required: true
  type: object
  description: >
    The specification currently owned by the architect.
    This represents the architect's responsibility for this specification
    only. A status of waiting_for_implementation means the specification
    has been handed to the Software Developer and no further architect
    action is required unless implementation feedback, clarification, or
    review is requested.

  properties:

    id:
      type: string
      required: true
      description: >
        Identifier of the specification currently owned by the architect.

    version:
      type: integer
      required: true
      description: >
        Version of the active specification.

  status:
    required: true
    type: enum
    values:

      idle:
        meaning: >
          No active architectural work is assigned.

      assigned:
        meaning: >
          A work request has been assigned and requires architectural analysis.

      analyzing:
        meaning: >
          Requirements, existing implementation, architecture, and constraints
          are being analyzed.

      waiting_for_management_clarification:
        meaning: >
          Architectural work cannot continue because Management clarification
          or a product decision is required.

      specifying:
        meaning: >
          The architect is creating or updating the technical specification.

      waiting_for_implementation:
        meaning: >
          The current specification has been completed and handed to the Software
          Developer for implementation. The architect has no active work remaining
          on this specification unless implementation feedback or a completed
          implementation review is received. The architect may receive and process
          new architectural assignments independently.

      waiting_for_developer_feedback:
        meaning: >
          The Software Developer has raised an implementation question or
          clarification request requiring architectural input.

      reviewing_implementation:
        meaning: >
          Completed implementation is being evaluated against the specification.

      completed:
        meaning: >
          Architectural responsibilities for the current specification are
          complete.

      blocked:
        meaning: >
          Architectural work cannot continue because required information,
          decisions, or dependencies are unavailable.

  waiting_for:
    required: false
    type: object
    description: >
      Records the external event and responsible role preventing progress.

    properties:

      event:
        required: true
        type: enum
        values:

          management_clarification:
            meaning: >
              Waiting for Management to provide requirements, priorities,
              or product decisions.

          developer_feedback:
            meaning: >
              Waiting for Software Developer implementation questions or
              clarification requests.

      role:
        required: true
        type: enum
        values:

          management:
            meaning: >
              Management.

          software_developer:
            meaning: >
              Software Developer.

  plans:
    required: true
    type: list
    description: >
      Implementation plans associated with the active specification.
    item_type:
      type: string

  conventions:
    required: true
    type: list
    description: >
      Conventions governing architectural and implementation decisions.
    item_type:
      type: string

  parked_work:
    required: true
    type: list
    description: >
      Deferred architectural work.
    item_type:
      type: string

  adrs:
    required: true
    type: list
    description: >
      Architecture Decision Records created during architectural work.
    item_type:
      type: string

  rfis:
    required: true
    type: list
    description: >
      Requests For Information raised by or received by the architect.
    item_type:
      type: string

  notifications:
    required: true
    type: list
    description: >
      Notifications received or generated by the architect.
    item_type:
      type: string

  handoff:
    required: true
    type: object
    properties:

      target_role:
        required: true
        type: enum
        values:

          null:
            meaning: >
              No handoff is currently planned.

          software_developer:
            meaning: >
              Specification is handed to the Software Developer.

          management:
            meaning: >
              Decision or approval is handed to Management.

      status:
        required: true
        type: enum
        values:

          null:
            meaning: >
              No handoff exists.

          pending:
            meaning: >
              Handoff preparation has started.

          sent:
            meaning: >
              Handoff has been submitted.

          accepted:
            meaning: >
              Receiving role has accepted the handoff.

state_transitions:

  idle:
    allowed:
      - assigned

  assigned:
    allowed:
      - analyzing
      - blocked

  analyzing:
    allowed:
      - waiting_for_management_clarification
      - specifying
      - blocked

  waiting_for_management_clarification:
    allowed:
      - analyzing
      - specifying
      - blocked

  specifying:
    allowed:
      - waiting_for_implementation
      - waiting_for_management_clarification
      - blocked

  waiting_for_implementation:
    allowed:
      - waiting_for_developer_feedback
      - reviewing_implementation
      - blocked

  waiting_for_developer_feedback:
    allowed:
      - specifying
      - waiting_for_implementation
      - blocked

  reviewing_implementation:
    allowed:
      - completed
      - blocked

  blocked:
    allowed:
      - assigned
      - analyzing
      - specifying
      - waiting_for_management_clarification

  completed:
    allowed:
      - idle
