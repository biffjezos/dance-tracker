# .agents/docs/state_definitions/state_definition_software_developer.yaml
state_definition:
  name: state_definition_software_developer
  version: 3
  owner_role: management

description:
  purpose: >
    Defines the operational state model for the Software Developer role.
    The state records implementation work based on approved specifications,
    clarification requests, validation, review handoff, post-review delivery,
    and completion.

fields:

  active_specification:
    required: true
    type: object
    properties:

      id:
        type: string
        required: true

      version:
        type: integer
        required: true

  status:
    required: true
    type: enum
    values:

      idle:
        meaning: >
          No implementation assignment is currently active.

      assigned:
        meaning: >
          An approved specification has been assigned and implementation
          preparation is being performed.

      analyzing:
        meaning: >
          The Software Developer is analyzing the specification,
          existing implementation, dependencies, conventions,
          and implementation constraints before modifying code.

      implementing:
        meaning: >
          Code changes are actively being implemented according to the
          approved specification.

      waiting_for_architect_clarification:
        meaning: >
          Implementation cannot continue because clarification from the
          Software Architect is required.

      waiting_for_management_decision:
        meaning: >
          Implementation cannot continue because a Management decision
          is required.

      validating:
        meaning: >
          Implementation is complete and the Software Developer is executing
          required tests and validation.

      ready_for_review:
        meaning: >
          Implementation and validation are complete and the changes are
          ready for Code Reviewer evaluation.

      addressing_review_feedback:
        meaning: >
          Code Reviewer has identified issues and the Software Developer
          is applying required corrections.

      waiting_for_review_approval:
        meaning: >
          The implementation has been submitted to the Code Reviewer and the
          Software Developer is waiting for the review result.

      preparing_delivery:
        meaning: >
          Code Reviewer has approved the implementation and the Software
          Developer is preparing the approved implementation for delivery.

      delivering:
        meaning: >
          The Software Developer is pushing and merging the reviewed
          implementation according to repository workflow rules.

      blocked:
        meaning: >
          Implementation cannot continue because required information,
          decisions, dependencies, or delivery requirements are unavailable.

  current_task:
    required: false
    type: object
    properties:

      name:
        type: string
        required: true

      description:
        type: string
        required: true

  progress:
    required: true
    type: object
    properties:

      completed:
        type: array
        required: true
        item_type:
          type: string

      remaining:
        type: array
        required: true
        item_type:
          type: string

  modified_files:
    required: true
    type: array
    item_type:
      type: string

  tests:
    required: true
    type: object
    properties:

      executed:
        type: array
        required: true
        item_type:
          type: string

      results:
        type: array
        required: true
        item_type:
          type: string

  blockers:
    required: true
    type: array
    item_type:
      type: string

  rfis:
    required: true
    type: array
    item_type:
      type: string

  handoff:
    required: true
    type: object
    properties:

      target_role:
        required: true
        type: enum
        values:
          "null":
            meaning: >
              No handoff is currently planned.

          software_architect:
            meaning: >
              Architectural clarification or specification feedback is
              being requested.

          management:
            meaning: >
              Management decision is required.

          code_reviewer:
            meaning: >
              Completed implementation is being handed to Code Reviewer.

      status:
        required: true
        type: enum
        values:
          "null":
            meaning: >
              No handoff exists.

          pending:
            meaning: >
              Handoff preparation has started.

          sent:
            meaning: >
              Handoff has been submitted.

          accepted:
            meaning: >
              Receiving role has accepted the handoff.

state_transitions:

  idle:
    allowed:
      - assigned
      - blocked

  assigned:
    allowed:
      - analyzing
      - blocked

  analyzing:
    allowed:
      - implementing
      - waiting_for_architect_clarification
      - blocked

  implementing:
    allowed:
      - waiting_for_architect_clarification
      - waiting_for_management_decision
      - validating
      - blocked

  waiting_for_architect_clarification:
    allowed:
      - analyzing
      - blocked

  waiting_for_management_decision:
    allowed:
      - analyzing
      - blocked

  validating:
    allowed:
      - ready_for_review
      - implementing
      - blocked

  ready_for_review:
    allowed:
      - waiting_for_review_approval
      - blocked

  addressing_review_feedback:
    allowed:
      - validating
      - implementing
      - blocked

  waiting_for_review_approval:
    allowed:
      - blocked

  preparing_delivery:
    allowed:
      - delivering
      - blocked

  delivering:
    allowed:
      - idle
      - blocked

  blocked:
    allowed:
      - assigned
      - analyzing
      - implementing
      - waiting_for_architect_clarification
      - waiting_for_management_decision
      - validating
      - ready_for_review
      - waiting_for_review_approval
      - addressing_review_feedback
      - preparing_delivery
      - delivering
      
events:

  review_approved:
    meaning: >
      Code Reviewer approved the implementation.
    transitions:
      waiting_for_review_approval:
        - preparing_delivery

  review_changes_requested:
    meaning: >
      Code Reviewer rejected the implementation and requested changes.
    transitions:
      waiting_for_review_approval:
        - addressing_review_feedback