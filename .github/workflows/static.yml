name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'engine/src/operations/**'
              - 'engine/src/app.rs'
              - 'engine/src/dom.rs'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'

            rust:
              - 'engine/src/**'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'

            ui:
              - 'ui/**'


  build-wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Cache WASM package
        uses: actions/cache@v4
        with:
          path: engine/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles(
            'engine/src/operations/**',
            'engine/src/app.rs',
            'engine/src/dom.rs',
            'engine/Cargo.toml',
            'engine/Cargo.lock'
          ) }}

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: wasm-pack build engine --target web


  build-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.wasm != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Build Rust
        run: cargo build


  deploy:
    needs:
      - changes
      - build-wasm
      - build-rust
    if: always()

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Restore WASM package from cache
        uses: actions/cache@v4
        id: wasm-cache
        with:
          path: engine/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles(
            'engine/src/operations/**',
            'engine/src/app.rs',
            'engine/src/dom.rs',
            'engine/Cargo.toml',
            'engine/Cargo.lock'
          ) }}

      - name: Check if WASM files exist
        id: wasm-exists
        run: |
          if [ -f "engine/pkg/dance_tracker_core_bg.wasm" ] && \
             [ -f "engine/pkg/dance_tracker_core.js" ] && \
             [ -f "engine/pkg/dance_tracker_core.d.ts" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Copy WASM package
        if: steps.wasm-exists.outputs.exists == 'true' || steps.wasm-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p ui/scripts/engine/pkg
          cp -r engine/pkg/* ui/scripts/engine/pkg/

      - name: Restore Rust build from cache
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.wasm == 'true'
        uses: actions/cache@v4
        with:
          path: engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Write build metadata
        run: echo "${GITHUB_SHA}" > ui/build-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ui

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
