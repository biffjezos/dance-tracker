name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'engine/src/operations/**'
              - 'engine/src/app.rs'
              - 'engine/src/dom.rs'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'
              - 'ui/scripts/engine/**'

            rust:
              - 'engine/src/**'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'

            ui:
              - 'ui/**'


  build-wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: wasm-pack build engine --target web

      - name: Save WASM package
        uses: actions/cache@v4
        with:
          path: engine/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles(
            'engine/src/operations/**',
            'engine/src/app.rs',
            'engine/src/dom.rs',
            'engine/Cargo.toml',
            'engine/Cargo.lock'
          ) }}


  build-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.wasm != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build Rust
        run: cargo build --manifest-path engine/Cargo.toml


  deploy:
    needs:
      - changes
      - build-wasm
      - build-rust
    if: always()

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - name: Restore WASM package
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: engine/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles(
            'engine/src/operations/**',
            'engine/src/app.rs',
            'engine/src/dom.rs',
            'engine/Cargo.toml',
            'engine/Cargo.lock'
          ) }}
          restore-keys: |
            wasm-${{ runner.os }}-


      - name: Verify WASM exists
        run: |
          if [ ! -f "engine/pkg/dance_tracker_core_bg.wasm" ]; then
            echo "ERROR: WASM package missing"
            exit 1
          fi

          if [ ! -f "engine/pkg/dance_tracker_core.js" ]; then
            echo "ERROR: WASM JS loader missing"
            exit 1
          fi


      - name: Copy WASM package
        run: |
          mkdir -p ui/scripts/engine/pkg
          rm -rf ui/scripts/engine/pkg/*
          cp -a engine/pkg/. ui/scripts/engine/pkg/


      - name: Write build metadata
        run: echo "${GITHUB_SHA}" > ui/build-version.txt


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ui


      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5


  cleanup:
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:

      - name: Delete workflow runs older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo ${{ github.repository }} \
            --limit 1000 \
            --json databaseId,createdAt \
            --jq '.[] | select(.createdAt < (now - 2592000 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .databaseId' \
          | xargs -r -n 1 gh run delete --repo ${{ github.repository }}