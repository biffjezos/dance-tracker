name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      ui: ${{ steps.filter.outputs.ui }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'engine/src/**'
              - 'engine/Cargo.toml'
              - 'engine/Cargo.lock'
              - 'ui/core/wasm.js'
              - 'ui/core/operations.js'

            ui:
              - 'ui/**'


  build-wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Cache WASM package
        uses: actions/cache@v4
        with:
          path: engine/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles(
            'engine/src/**',
            'engine/Cargo.toml',
            'engine/Cargo.lock'
          ) }}

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: wasm-pack build engine --target web


  deploy:
    needs:
      - changes
      - build-wasm
    if: always()

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Restore WASM package
        uses: actions/cache@v4
        with:
          path: engine/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles(
            'engine/src/**',
            'engine/Cargo.toml',
            'engine/Cargo.lock'
          ) }}

      - name: Copy WASM package
        run: |
          mkdir -p ui/engine/pkg
          cp -r engine/pkg/* ui/engine/pkg/

      - name: Write build metadata
        run: echo "${GITHUB_SHA}" > ui/build-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ui

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5